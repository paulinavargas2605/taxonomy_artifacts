<h2 mat-dialog-title>

    {{data ? 'Editar Usuario' : 'Nuevo Usuario'}}

</h2>

<mat-dialog-content>

<form [formGroup]="formulario">

    <mat-form-field appearance="outline">

        <mat-label>Nombre</mat-label>

        <input
        matInput
        formControlName="nombre_usuario">

    </mat-form-field>


    <mat-form-field appearance="outline">

        <mat-label>Correo</mat-label>

        <input
        matInput
        formControlName="correo">

    </mat-form-field>


    <mat-form-field appearance="outline">

        <mat-label>Contraseña</mat-label>

        <input
        matInput
        type="password"
        formControlName="contrasena_hash">

    </mat-form-field>


    <mat-form-field appearance="outline">

        <mat-label>Tipo Usuario</mat-label>

        <input
        matInput
        type="number"
        formControlName="id_tipo_usuario">

    </mat-form-field>

</form>

</mat-dialog-content>


<mat-dialog-actions align="end">

<button
mat-button
(click)="cancelar()">

Cancelar

</button>


<button
mat-raised-button
color="primary"
(click)="guardar()">

Guardar

</button>

</mat-dialog-actions>
