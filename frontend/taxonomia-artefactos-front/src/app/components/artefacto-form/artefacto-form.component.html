<h2 mat-dialog-title>

    {{ data ? 'Editar Artefacto' : 'Nuevo Artefacto' }}

</h2>

<mat-dialog-content>

<form [formGroup]="formulario">

    <mat-form-field appearance="outline">

        <mat-label>Nombre</mat-label>

        <input
            matInput
            formControlName="nombre">

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>ID Usuario</mat-label>

        <input
            matInput
            type="number"
            formControlName="id_usuario">

    </mat-form-field>

    <mat-form-field appearance="outline">

        <mat-label>URL Imagen</mat-label>

        <input
            matInput
            formControlName="url_imagen">

    </mat-form-field>

    <mat-slide-toggle formControlName="activo">

        Activo

    </mat-slide-toggle>

</form>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button
        mat-button
        (click)="cancelar()">

        Cancelar

    </button>

    <button
        mat-raised-button
        color="primary"
        (click)="guardar()">

        Guardar

    </button>

</mat-dialog-actions>
