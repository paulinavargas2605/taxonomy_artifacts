<div class="contenedor">

    <div class="encabezado">

        <h1>Artefactos</h1>

        <button
            mat-raised-button
            color="primary"
            (click)="nuevoArtefacto()">

            Nuevo Artefacto

        </button>

    </div>

    <table
        mat-table
        [dataSource]="artefactos"
        class="mat-elevation-z2">

        <!-- ID -->

        <ng-container matColumnDef="id">

            <th mat-header-cell *matHeaderCellDef>

                ID

            </th>

            <td mat-cell *matCellDef="let artefacto">

                {{ artefacto.id_artefacto }}

            </td>

        </ng-container>

        <!-- Nombre -->

        <ng-container matColumnDef="nombre">

            <th mat-header-cell *matHeaderCellDef>

                Nombre

            </th>

            <td mat-cell *matCellDef="let artefacto">

                {{ artefacto.nombre }}

            </td>

        </ng-container>

        <!-- Usuario -->

        <ng-container matColumnDef="usuario">

            <th mat-header-cell *matHeaderCellDef>

                Usuario

            </th>

            <td mat-cell *matCellDef="let artefacto">

                {{ artefacto.id_usuario }}

            </td>

        </ng-container>

        <!-- Imagen -->

        <ng-container matColumnDef="imagen">

            <th mat-header-cell *matHeaderCellDef>

                URL Imagen

            </th>

            <td mat-cell *matCellDef="let artefacto">

                {{ artefacto.url_imagen }}

            </td>

        </ng-container>

        <!-- Activo -->

        <ng-container matColumnDef="activo">

            <th mat-header-cell *matHeaderCellDef>

                Activo

            </th>

            <td mat-cell *matCellDef="let artefacto">

                {{ artefacto.activo ? 'Sí' : 'No' }}

            </td>

        </ng-container>

        <!-- Acciones -->

        <ng-container matColumnDef="acciones">

            <th mat-header-cell *matHeaderCellDef>

                Acciones

            </th>

            <td mat-cell *matCellDef="let artefacto">

                <button
                    mat-raised-button
                    color="primary"
                    (click)="editar(artefacto)">

                    Editar

                </button>

                <button
                    mat-raised-button
                    color="warn"
                    (click)="eliminar(artefacto)">

                    Eliminar

                </button>

            </td>

        </ng-container>

        <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns;">
        </tr>

    </table>

</div>
