<div class="container">

    <div class="header">

        <h1>Users</h1>

        <button
        mat-raised-button
        color="primary"
        (click)="newUser()">

            New User

        </button>

    </div>

    <table
    mat-table
    [dataSource]="users"
    class="mat-elevation-z2">

        <ng-container matColumnDef="id">

            <th mat-header-cell *matHeaderCellDef>

                ID

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.id_usuario}}

            </td>

        </ng-container>

        <ng-container matColumnDef="name">

            <th mat-header-cell *matHeaderCellDef>

                User

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.nombre_usuario}}

            </td>

        </ng-container>

        <ng-container matColumnDef="email">

            <th mat-header-cell *matHeaderCellDef>

                Email

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.correo}}

            </td>

        </ng-container>

        <ng-container matColumnDef="type">

            <th mat-header-cell *matHeaderCellDef>

                Type

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.id_tipo_usuario}}

            </td>

        </ng-container>

        <ng-container matColumnDef="actions">

            <th mat-header-cell *matHeaderCellDef>

                Actions

            </th>

            <td mat-cell *matCellDef="let user">

                <button
                mat-raised-button
                color="primary"
                (click)="edit(user)">

                    Edit

                </button>

                <button
                mat-raised-button
                color="warn"
                (click)="delete(user)">

                    Delete

                </button>

            </td>

        </ng-container>

        <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"></tr>

        <tr
        mat-row
        *matRowDef="let row;columns:displayedColumns;"></tr>

    </table>

</div>
