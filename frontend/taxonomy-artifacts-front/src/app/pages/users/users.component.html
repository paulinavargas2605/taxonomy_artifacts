<div class="container">

    <div class="header">

        <h1>{{ 'USERS.TITLE' | translate }}</h1>

        <button
        mat-raised-button
        color="primary"
        (click)="newUser()">

            {{ 'USERS.NEW' | translate }}

        </button>

    </div>

    <table
    mat-table
    [dataSource]="users"
    class="mat-elevation-z2">

        <ng-container matColumnDef="id">

            <th mat-header-cell *matHeaderCellDef>

                {{ 'USERS.COLUMN_ID' | translate }}

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.id_user}}

            </td>

        </ng-container>

        <ng-container matColumnDef="name">

            <th mat-header-cell *matHeaderCellDef>

                {{ 'USERS.COLUMN_USER' | translate }}

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.username}}

            </td>

        </ng-container>

        <ng-container matColumnDef="email">

            <th mat-header-cell *matHeaderCellDef>

                {{ 'USERS.COLUMN_EMAIL' | translate }}

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.email}}

            </td>

        </ng-container>

        <ng-container matColumnDef="type">

            <th mat-header-cell *matHeaderCellDef>

                {{ 'USERS.COLUMN_TYPE' | translate }}

            </th>

            <td mat-cell *matCellDef="let user">

                {{user.id_user_type}}

            </td>

        </ng-container>

        <ng-container matColumnDef="actions">

            <th mat-header-cell *matHeaderCellDef>

                {{ 'USERS.COLUMN_ACTIONS' | translate }}

            </th>

            <td mat-cell *matCellDef="let user">

                <button
                mat-raised-button
                color="primary"
                (click)="edit(user)">

                    {{ 'USERS.EDIT' | translate }}

                </button>

                <button
                mat-raised-button
                color="warn"
                (click)="delete(user)">

                    {{ 'USERS.DELETE' | translate }}

                </button>

            </td>

        </ng-container>

        <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"></tr>

        <tr
        mat-row
        *matRowDef="let row;columns:displayedColumns;"></tr>

    </table>

</div>
