<div class="container">

    <div class="header">

        <h1>Artifacts</h1>

        <button
            mat-raised-button
            color="primary"
            (click)="newArtifact()">

            New Artifact

        </button>

    </div>

    <table
        mat-table
        [dataSource]="artifacts"
        class="mat-elevation-z2">

        <!-- ID -->

        <ng-container matColumnDef="id">

            <th mat-header-cell *matHeaderCellDef>

                ID

            </th>

            <td mat-cell *matCellDef="let artifact">

                {{ artifact.id_artefacto }}

            </td>

        </ng-container>

        <!-- Name -->

        <ng-container matColumnDef="name">

            <th mat-header-cell *matHeaderCellDef>

                Name

            </th>

            <td mat-cell *matCellDef="let artifact">

                {{ artifact.nombre }}

            </td>

        </ng-container>

        <!-- User -->

        <ng-container matColumnDef="user">

            <th mat-header-cell *matHeaderCellDef>

                User

            </th>

            <td mat-cell *matCellDef="let artifact">

                {{ artifact.id_usuario }}

            </td>

        </ng-container>

        <!-- Image -->

        <ng-container matColumnDef="image">

            <th mat-header-cell *matHeaderCellDef>

                Image URL

            </th>

            <td mat-cell *matCellDef="let artifact">

                {{ artifact.url_imagen }}

            </td>

        </ng-container>

        <!-- Active -->

        <ng-container matColumnDef="active">

            <th mat-header-cell *matHeaderCellDef>

                Active

            </th>

            <td mat-cell *matCellDef="let artifact">

                {{ artifact.activo ? 'Yes' : 'No' }}

            </td>

        </ng-container>

        <!-- Actions -->

        <ng-container matColumnDef="actions">

            <th mat-header-cell *matHeaderCellDef>

                Actions

            </th>

            <td mat-cell *matCellDef="let artifact">

                <button
                    mat-raised-button
                    color="primary"
                    (click)="edit(artifact)">

                    Edit

                </button>

                <button
                    mat-raised-button
                    color="warn"
                    (click)="delete(artifact)">

                    Delete

                </button>

            </td>

        </ng-container>

        <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns;">
        </tr>

    </table>

</div>
