<mat-sidenav-container class="container">

  <mat-sidenav mode="side" opened class="menu">

    <div class="brand">Artifact Taxonomy</div>

    <mat-nav-list>

      <a mat-list-item routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>

      <a mat-list-item routerLink="/artifacts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>collections_bookmark</mat-icon>
        <span matListItemTitle>Artifacts</span>
      </a>

      <a mat-list-item routerLink="/users" routerLinkActive="active-link">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Users</span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <mat-sidenav-content>

    <mat-toolbar color="primary">
      Artifact Taxonomy
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
