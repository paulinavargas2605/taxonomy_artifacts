<mat-sidenav-container class="container">

  <mat-sidenav mode="side" opened class="menu">

    <div class="brand">{{ 'MENU.BRAND' | translate }}</div>

    <mat-nav-list>

      <a mat-list-item routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>{{ 'MENU.HOME' | translate }}</span>
      </a>

      <a mat-list-item routerLink="/artifacts" routerLinkActive="active-link">
        <mat-icon matListItemIcon>collections_bookmark</mat-icon>
        <span matListItemTitle>{{ 'MENU.ARTIFACTS' | translate }}</span>
      </a>

      <a mat-list-item routerLink="/users" routerLinkActive="active-link" *ngIf="(currentUser$ | async)?.id_user_type === 4">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>{{ 'MENU.USERS' | translate }}</span>
      </a>

    </mat-nav-list>

    <div class="lang-switch">

      <span class="lang-title">{{ 'LANG.TITLE' | translate }}</span>

      <div class="lang-row">

        <span class="lang-option" [class.active]="currentLang === 'en'">
          <img src="flags/uk.svg" alt="" class="flag">
          {{ 'LANG.EN' | translate }}
        </span>

        <mat-slide-toggle
          [checked]="currentLang === 'es'"
          (change)="onLanguageToggle($event.checked)">
        </mat-slide-toggle>

        <span class="lang-option" [class.active]="currentLang === 'es'">
          <img src="flags/es.svg" alt="" class="flag">
          {{ 'LANG.ES' | translate }}
        </span>

      </div>

    </div>

  </mat-sidenav>

  <mat-sidenav-content>

    <ng-container *ngIf="(currentUser$ | async) as user; else loggedOut">

      <button
        mat-stroked-button
        color="primary"
        class="login-btn"
        [matMenuTriggerFor]="userMenu">

        <mat-icon>account_circle</mat-icon>
        {{ user.username }}

      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>{{ 'MENU.LOGOUT' | translate }}</span>
        </button>
      </mat-menu>

    </ng-container>

    <ng-template #loggedOut>

      <button
        mat-stroked-button
        color="primary"
        class="login-btn"
        routerLink="/login">

        <mat-icon>login</mat-icon>
        {{ 'MENU.LOGIN' | translate }}

      </button>

    </ng-template>

    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>
